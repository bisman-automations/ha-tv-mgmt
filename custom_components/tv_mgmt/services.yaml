grant_extension:
  fields:
    profile_id:
      required: true
      selector:
        config_entry:
          integration: tv_mgmt
    minutes:
      required: true
      selector:
        number:
          min: -240
          max: 240
          step: 5
          unit_of_measurement: min

force_block:
  fields:
    profile_id:
      required: true
      selector:
        config_entry:
          integration: tv_mgmt

unblock:
  fields:
    profile_id:
      required: true
      selector:
        config_entry:
          integration: tv_mgmt

reset_usage:
  fields:
    profile_id:
      required: true
      selector:
        config_entry:
          integration: tv_mgmt

send_message:
  fields:
    profile_id:
      required: true
      selector:
        config_entry:
          integration: tv_mgmt
    message:
      required: true
      example: Dinner is ready
      selector:
        text:
    apple_tv:
      default: true
      selector:
        boolean:
    screen:
      default: true
      selector:
        boolean:
    speak:
      default: false
      selector:
        boolean:

set_title_color:
  fields:
    title:
      required: true
      example: "The Lego Movie"
      selector:
        text:
    rgb_color:
      required: true
      example: [255, 120, 0]
      selector:
        color_rgb:

remove_title_color:
  fields:
    title:
      required: true
      example: "The Lego Movie"
      selector:
        text:

list_title_colors:

resync_lights:
  fields:
    profile_id:
      required: false
      selector:
        config_entry:
          integration: tv_mgmt
    zone:
      required: false
      example: "TV lights"
      selector:
        text:

clear_artwork_cache:
  fields:
    resync:
      required: false
      default: false
      selector:
        boolean:
    include_metadata:
      required: false
      default: false
      selector:
        boolean:
