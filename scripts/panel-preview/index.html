      case "tv_mgmt/message": window.lastMessage = msg; return { sent: ["apple_tv", "screen"].filter(k => msg[k]) };
      case "tv_mgmt/light_sync/get": return lightSync();
      // Zones answer like the real backend: a zone's id is "id", unknown keys
      // and unknown zones are refused (so the panel can't drift from it).
      case "tv_mgmt/light_sync/zone/save": window.lastZone = msg; {
        const tv = lightTvs[msg.entry_id];
        const extra = Object.keys(msg.zone).filter((k) => k !== "id" && !(k in LIGHT_DEFAULTS));
        if (extra.length) throw { code: "invalid_format", message: `extra keys not allowed @ data['zone']['${extra[0]}']` };
        if (!(msg.zone.lights || []).length) throw { code: "invalid_format", message: "required key not provided @ data['zone']['lights']" };
        const at = msg.zone.id === undefined ? -1 : tv.zones.findIndex((z) => z.config.id === msg.zone.id);
        if (msg.zone.id !== undefined && at < 0) throw { code: "not_found", message: "That light zone doesn't exist" };
        const config = { ...LIGHT_DEFAULTS, ...(at >= 0 ? tv.zones[at].config : {}), ...msg.zone, id: msg.zone.id || "z" + Date.now().toString(36) };
        config.name = config.name || "Lights";
        if (at >= 0) tv.zones[at] = { ...tv.zones[at], config, status: config.enabled ? tv.zones[at].status : { ...tv.zones[at].status, syncing: false } };
        else tv.zones.push({ config, status: null, entities: {} });
        return { zone: config }; }
      case "tv_mgmt/light_sync/zone/remove": {
        window.lastZoneRemove = msg;
        const tv = lightTvs[msg.entry_id];
        if (!tv.zones.some((z) => z.config.id === msg.zone_id)) throw { code: "not_found", message: "That light zone doesn't exist" };
        tv.zones = tv.zones.filter((z) => z.config.id !== msg.zone_id);
        return null; }
      case "tv_mgmt/light_sync/zone/action":
        window.lastZoneAction = msg;
        if (!lightTvs[msg.entry_id].zones.some((z) => z.config.id === msg.zone_id)) throw { code: "not_found", message: "That light zone doesn't exist" };
        return msg.action === "resync" ? { outcome: "applied", error: null } : { title: "harbor tales" };
      case "tv_mgmt/light_sync/settings/set": window.lastLightSettings = msg; lightSettings = { metadata_providers: msg.metadata_providers, tmdb_key_set: msg.tmdb_api_key === undefined ? lightSettings.tmdb_key_set : !!msg.tmdb_api_key, trakt_key_set: msg.trakt_client_id === undefined ? lightSettings.trakt_key_set : !!msg.trakt_client_id }; return { settings: lightSettings };
      case "tv_mgmt/light_sync/titles/set": lightTitles.push({ title: msg.title, key: msg.title.toLowerCase(), rgb_color: msg.rgb_color, hex: "#" + msg.rgb_color.map((n) => n.toString(16).padStart(2, "0")).join(""), updated: nowIso }); return { key: msg.title.toLowerCase() };
      case "tv_mgmt/light_sync/titles/remove": lightTitles = lightTitles.filter((t) => t.title !== msg.title); return null;
      case "tv_mgmt/lights/set": {
        window.lastLights = msg;
        const p = profiles.find((x) => x.entry_id === msg.entry_id) || profiles[0];
        if (msg.lights) p.tv_lights = msg.lights;
        if (msg.follow !== undefined) p.tv_lights_follow = msg.follow;
        return { lights: p.tv_lights, follow: p.tv_lights_follow };
      }
      case "tv_mgmt/lights/off": {
        window.lastLightsOff = msg;
        const p = profiles.find((x) => x.entry_id === msg.entry_id) || profiles[0];
        p.tv_lights_held_off = true;
        return { lights: p.tv_lights, failed: {}, profile: p };
      }
      case "tv_mgmt/remote": window.lastRemote = msg; return { key: msg.key };
      case "tv_mgmt/action": window.lastAction = msg; return { profile: profiles.find(p => p.entry_id === msg.entry_id) };
    }
    throw { code: "unknown_command", message: msg.type };
  },
  // busy=1: a live update every 50 ms, as with lots of media players.
  connection: { subscribeMessage: async (cb) => {
    window.pushUpdate = cb;
    if (params.get("busy")) setInterval(() => cb({ entry_id: "fam" }), 50);
    return () => {};
  } },
};
</script>
<script type="module">
  await import("../../custom_components/tv_mgmt/frontend/tv-mgmt-panel.js?v=" + Date.now());
  const el = document.createElement("tv-mgmt-panel");
  el.narrow = true;
  el.hass = window.hass;
  el.addEventListener("hass-more-info", (e) => { window.lastMoreInfo = e.detail.entityId; });
  window.panel = el;
  document.body.appendChild(el);
</script>
